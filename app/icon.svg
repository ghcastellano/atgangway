<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
  <!-- Ícone de app do At Gangway: a mesma cena do logotipo (casco,
       prancha, cais) em formas CHEIAS, não em traço.
       O mark de linha do cabeçalho vira um borrão a 16px — as duas
       guias da prancha se fundem e sobra uma mancha. Aqui a prancha é
       uma faixa sólida, e o que resta a 16px ainda é uma diagonal
       descendo de um casco para o cais: a leitura certa. -->
  <rect width="100" height="100" rx="22" fill="#040D1A"/>
  <g fill="#FFB648">
    <!-- casco atracado, no alto -->
    <path d="M36 20h50l-11 22H47Z"/>
    <!-- prancha de embarque: faixa sólida até o cais -->
    <path d="M47 42h14L33 78H19Z"/>
    <!-- cais -->
    <rect x="14" y="80" width="72" height="8" rx="4"/>
  </g>
</svg>
