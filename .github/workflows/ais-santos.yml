# IMO, MMSI e bandeira dos navios, ouvindo o AIS ao redor de Santos.
#
# O line-up da CODESP não traz o IMO; o AIS traz, e o aisstream.io repassa
# o feed de graça. Oito minutos de escuta a cada três horas pegam a
# mensagem estática (a cada 6 min) de quem está no porto, no fundeadouro
# ou chegando. Com IMO no banco, o buscador de fotos acha o casco certo.
#
# Precisa dos segredos AISSTREAM_API_KEY (chave gratuita, criada com o
# login do GitHub em https://aisstream.io) e SUPABASE_SERVICE_ROLE_KEY.
# Sem a chave do AIS o job termina em silêncio, sem falhar.
name: ais-santos

on:
  schedule:
    - cron: "15 */3 * * *"
  workflow_dispatch: {}

concurrency:
  group: ais-santos
  cancel-in-progress: false

jobs:
  ouvir:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Ouvir o AIS e gravar
        env:
          AISSTREAM_API_KEY: ${{ secrets.AISSTREAM_API_KEY }}
          SUPABASE_URL: https://cuaocjxofaizefzcxlyc.supabase.co
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: |
          if [ -z "$AISSTREAM_API_KEY" ]; then
            echo "AISSTREAM_API_KEY ausente — nada a fazer."
            exit 0
          fi
          node scripts/ais-santos.mjs --minutos 8
